handles: [prairiedog_77, sandhillsgirl, oldsodbuster, county_road_k, windbreak, gravelroadghost, shelterbelt, section_line, lastcalvinghand, meadowlark_ne, quietcreek, twoswitch]

# Details a manifestation must never take, because its own form settles them.
detail_exclude:
  fire_line: [color, height]
  lantern: [height]
  noon_woman: [clothing]
  wet_figure: []

# How each manifestation is reported in a later account. Past tense verb
# phrases, so "#wname# #report#" and "I #report#" both read.
report:
  walker: ["saw a figure walking at the edge of the lamplight, keeping pace", "saw someone walking just beyond the lamplight, who stopped whenever #he_w# stopped"]
  rider: ["saw a horseman on the skyline keeping pace, who would not answer a halloo", "was followed for a mile by a horseman who kept just out of hail"]
  wet_figure: ["saw a figure standing in the doorway, dripping wet", "found someone wet through standing in the open door, and only water on the boards after"]
  voice: ["heard a voice calling a name across the open country", "heard a name called three times out of the dark"]
  knocking: ["heard a knock at the door, three times, with no one there", "heard knocking at the window and found the yard empty"]
  phantom_team: ["heard a team and wagon go by close at hand and saw nothing", "heard trace chains and wheels pass on the road with no wagon on it"]
  lantern: ["saw a lantern swinging across the field with no one carrying it", "watched a lantern go by at the height of a man's hand, swinging, with nobody under it"]
  ball_light: ["saw a ball of light rolling along the ground", "saw a round light rolling down the section line"]
  meadow_lights: ["saw pale lights moving over the low ground", "counted pale lights over the meadow, five or six of them"]
  fire_line: ["saw a line of fire on the horizon that gave no smoke", "saw the skyline burning in a thin red line without smoke"]
  whirlwind: ["saw a whirlwind travel upwind across the pasture", "watched a whirlwind cross the road against the wind and stop at the fence"]
  ground_blizzard: ["was caught in a ground blizzard under a clear sky", "saw the snow blowing waist deep with no wind and the stars out"]
  cold_patch: ["rode into a cold place on a warm day, where breath showed white", "passed through a cold place a few rods across, like a cellar"]
  noon_woman: ["saw a woman's shape in the shimmer at the end of the field, nearer each time", "saw a woman standing in the shimmer off the ground, beckoning"]
  bell_ringing: ["heard a bell ringing where no bell has ever hung", "heard a bell tolling slow from the open prairie, where there is no bell"]
  returns: ["found it back in its old place, though it had been hauled off the week before", "found that it had come home again, however far it had been taken"]
  wrong_water: ["drew water from the well that came up warm and tasting of iron", "drew a bucket that came up rust red"]
  set_supper: ["found the table laid for supper in the empty house, the coffee hot", "found supper on the table in a house no one lives in"]
  singing_wire: ["heard the wire singing in still air along the whole fence line", "heard the fence hum and sing with no wind"]
