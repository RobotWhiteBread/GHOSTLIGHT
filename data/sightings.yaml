origin_months:
  drowned_ford: [3, 4, 5, 6]
  frozen_blizzard: [11, 12, 1, 2, 3]
  searcher: [11, 12, 1, 2, 3]
  prairie_fire: [3, 4, 9, 10, 11]
  lightning_herd: [5, 6, 7, 8]
  thirst: [6, 7, 8]
