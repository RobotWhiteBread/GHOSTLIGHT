remedy:
  lamp_window:
    markers: [lamp burning in the window]
    do: ["Keep a lamp burning in the window, and it will pass the house by.", "A lamp burning in the window is courtesy enough; it is said to look for one."]
    did: [kept a lamp burning in the window after that]
  school_bell:
    markers: [schoolhouse bell]
    do: ["Ring the schoolhouse bell until it passes.", "The schoolhouse bell is rung, steadily, until it has gone by."]
    did: [rang the schoolhouse bell until it went]
  horseshoe:
    markers: [horseshoe]
    do: ["Nail a horseshoe over the door, open end up, so the luck does not run out.", "A horseshoe over the door, open end up, keeps it from the house."]
    did: [nailed a horseshoe over the door]
  salt_sill:
    markers: [salt]
    do: ["Lay a line of salt along the sill, unbroken, before dark.", "It will not cross an unbroken line of salt laid along the sill."]
    did: [laid salt along the sill]
  steel_threshold:
    markers: [steel, scythe]
    do: ["Lay steel across the threshold, a knife or a scythe blade, and it will not come in.", "Steel across the threshold, as the old people did it, a knife or a scythe blade."]
    did: [laid a scythe blade across the threshold]
  blessed_herbs:
    markers: [Feast of the Assumption, herbs]
    do: ["Hang a wreath of herbs blessed on the Feast of the Assumption over the door.", "The wreath of herbs blessed at the Feast of the Assumption, hung over the door, keeps it off."]
    did: [hung the blessed herbs over the door]
  three_kings:
    markers: [Three Kings, Epiphany]
    do: ["Chalk the initials of the Three Kings over the door at Epiphany, and renew them every year.", "The Three Kings' initials, chalked over the door at Epiphany, are held to keep it out."]
    did: [chalked the Three Kings over the door]
  coat_inside_out:
    markers: [inside out]
    do: ["Turn your coat inside out and walk on, and it will lose you.", "The cure is to turn the coat inside out; it cannot follow a man whose coat is turned."]
    did: [turned my coat inside out]
  pray_for_soul:
    markers: [prayer for the soul, have a Mass, a Mass said]
    do: ["Say a prayer for the soul and promise it a Mass, and keep the promise.", "It asks for prayers. Say one for the soul and have a Mass said, and it will rest a while."]
    did: [said a prayer for the soul and had a Mass said]
  proper_burial:
    markers: [proper burial, properly buried]
    do: ["Find the bones and give them a proper burial with a marker. Nothing less has ever served.", "It will not rest until the bones are found and properly buried under a marker."]
    did: [went looking for the bones]
  marked_grave:
    markers: [stone on the grave]
    do: ["Set a stone on the grave each time you pass.", "Those who pass set a stone on the grave, and it lets them go by."]
    did: [set a stone on the grave]
  fireguard:
    markers: [fireguard]
    do: ["Plough a fireguard around the house and keep it clean of weeds.", "A fireguard ploughed around the buildings, kept clean, is the only proof against it."]
    did: [ploughed a fireguard around the house]
  never_answer:
    markers: [never answer, own name, do not answer it]
    do: ["Never answer it, and never say your own name aloud where it can hear.", "Do not answer it. Above all do not tell it your own name."]
    did: [did not answer]
  do_not_follow:
    markers: [do not follow]
    do: ["Do not follow it, however near it seems.", "The only rule is not to follow it, however near it seems or however familiar."]
    did: [did not follow it]
  cross_water:
    markers: [running water]
    do: ["Cross running water and it cannot come after you.", "It will not cross running water; get #the_river# between you and it."]
    did: ["crossed #the_river# and it came no farther"]
  leave_gate:
    markers: [as you found it, as you find them]
    do: ["Leave every gate as you found it.", "Leave the gates as you find them, open or shut, and it will let you be."]
    did: [left the gates as I found them]
  return_it:
    markers: [put the thing back]
    do: ["Put the thing back where it was taken from.", "Whatever was taken away must be put back where it was, or there will be no peace."]
    did: [put the thing back where it came from]
  stop_mill:
    markers: [tie the windmill off, tie off the mill]
    do: ["Tie the windmill off and let the tank go dry for a night.", "Tie off the mill and let the tank go dry one night, and it will be quiet for a season."]
    did: [tied the windmill off]
  water_for_dead:
    markers: [cup of water]
    do: ["Leave a cup of water on the step at night.", "A cup of water left on the step at night is all it asks."]
    did: [left a cup of water on the step]
  stay_inside:
    markers: [door barred]
    do: ["Stay indoors with the door barred until morning.", "There is nothing to be done but stay in with the door barred until it is light."]
    did: [stayed in with the door barred]

