# GHOSTLIGHT prose banks.
#
# How contradiction is prevented:
#   1. Templates (bottom of file) contain no folklore of their own. Every
#      claim about origin, manifestation, signs, conditions, remedy and
#      temper comes from the bank of the value the entity actually drew.
#   2. Each value may list `markers`, words that belong to it alone. After
#      an entry is written, the lint checks that no marker of a value the
#      entity did NOT draw appears in the text. If one does, the entry is
#      rewritten from the next sub-seed; if none pass, generation fails loudly.
#
# Symbols the banks may use (filled per entity, then fixed forever):
#   #dead#        the dead person, with their calling ("a freighter, Ole Lindqvist")
#   #dead_name#   just the name
#   #dead_first#  given name
#   #family#      a family of the district ("Hrabak")
#   #place#       the haunted spot in full
#   #place_short# a short handle for the spot
#   #river#       the nearest river or creek
#   #year#        year of the first recorded account
#   #light_src#   what people carried for light in that era
#   #rig#         what people drove in that era

origin:
  drowned_ford:
    epithet: [Drowned, Ford]
    markers: [drown]
    account:
      - "#dead# drowned at #place# in the spring of #year#, trying to cross when #the_river# was over its banks"
      - "#dead# went into #the_river# at #place# in high water and was not found until the river fell"
  frozen_blizzard:
    epithet: [Frozen, Blizzard, Winter]
    markers: [froze]
    account:
      - "#dead# was caught by a blizzard between the barn and the house and was found frozen in the spring, not forty rods from the door"
      - "#dead# set out ahead of a storm in the winter of #year# and froze within sight of a lighted window that no one in it could see past the snow"
  trail_cholera:
    epithet: [Emigrant, Wayside]
    markers: [cholera]
    account:
      - "#dead# died of cholera on the trail and was buried beside it the same afternoon, without a marker, because the train could not wait"
      - "#dead# took the cholera at #place# and was put in the ground there by people who had to be moving by morning"
  prairie_fire:
    epithet: [Burnt, Fire]
    markers: [prairie fire]
    account:
      - "#dead# was overtaken by a prairie fire in the fall of #year# while trying to reach the plowed ground at #place#"
      - "#dead# was burned in a prairie fire that came over the rise faster than a horse could run"
  claim_quarrel:
    noun: [Claim]
    epithet: [Claim, Quarrel]
    markers: [claim jumper, quarrel, contested claim]
    account:
      - "#dead# was killed in a quarrel over a contested claim at #place#, and the man who did it proved up on the land the next year"
      - "#dead# was shot in #year# over a quarter section that two families had filed on, and was buried on the disputed ground"
  rail_accident:
    dead_role: [a section hand, a brakeman]
    dead_sex: m
    noun: [Crossing]
    epithet: [Section, Iron]
    markers: [section gang, walking the track]
    account:
      - "#dead# was killed with the railroad section gang at #place#, crushed between two cars in the dark"
      - "#dead# was struck by a night train at #place# while walking the track home from the section house"
  lightning_herd:
    dead_role: [a cowhand, a night herder]
    dead_sex: m
    epithet: [Night Herd, Lightning]
    markers: [struck by lightning, killed by lightning]
    account:
      - "#dead# was struck by lightning while riding night herd near #place#, and the cattle ran until morning"
      - "#dead# was killed by lightning on night herd in the summer of #year#; the horse came in alone with its mane singed"
  thirst:
    epithet: [Thirsting, Dry Table]
    markers: [thirst]
    account:
      - "#dead# lost the trail on the dry table above #place# and died of thirst a half day from water"
      - "#dead# was found on the high ground in #year#, dead of thirst, with an empty canteen and the cork still in #his# hand"
  stampede:
    dead_role: [a cowhand, a young drover]
    dead_sex: m
    epithet: [Stampede, Drag]
    markers: [stampede, trampled]
    account:
      - "#dead# was trampled in a night stampede near #place#; they found #him# in the morning by the circling of the birds"
      - "#dead# went down under the herd when it ran in the dark, and the outfit buried #him# and drove on"
  well_cavein:
    dead_role: [a well digger, a hired hand]
    dead_sex: m
    noun: [Well]
    epithet: [Well, Buried]
    markers: [caved in, well digger]
    account:
      - "#dead# was digging a well for the #family# place when it caved in, and the well was filled and never dug again"
      - "#dead# was buried alive in #year# when the walls of a hand-dug well gave way at #place#"
  sod_collapse:
    noun: [Soddy, Sod House]
    epithet: [Sod House, Soddy]
    markers: [roof gave way, sod roof]
    account:
      - "#dead# was crushed when the sod roof of the #family# house gave way under a week of spring rain"
      - "#dead# died in #year# when the wet roof of a sod house came down in the night"
  searcher:
    epithet: [Searching, Lantern]
    markers: [search party, searcher]
    account:
      - "#dead# went out with #light_src.a# to find a neighbor lost in the snow and never came back; the neighbor walked in at dawn"
      - "#dead# joined the search party at #place# in #year# and was the only one of them not found"
  wet_meadow:
    epithet: [Meadow, Marsh]
    markers: [wet meadow]
    account:
      - "the first lights were seen over the wet meadow below the #family# place in #year#, the summer after the hay rotted standing"
      - "they rose out of the wet meadows at #place# after a hard year, and the old settlers say they have risen every hard year since"
  third_dry_summer:
    epithet: [Drought, Third Summer]
    markers: [third dry summer]
    account:
      - "it was first remarked in #year#, the third dry summer running, when the corn burned in the tassel"
      - "the #family# family dated it from the third dry summer, when the wells went down and the wind never stopped"
  broken_sod:
    noun: [Breaking]
    epithet: [Breaking, Sod]
    markers: [breaking plow, first broken]
    account:
      - "it woke when the sod at #place# was first broken, in #year#, and the man who broke it said the plow screamed"
      - "the #family# family broke the sod at #place# in #year# and say that something under it has been awake ever since"
  blowout:
    epithet: [Blowout, Sand]
    markers: [blowout]
    account:
      - "it lives in a blowout at #place#, where the grass let go of the sand in the dry year of #year# and never took hold again"
      - "the cattlemen first spoke of it in #year#, when the blowout at #place# opened in a single season"
  first_norther:
    epithet: [Norther, North Wind]
    markers: [norther]
    account:
      - "it comes in on the first norther of each year, and was first written of in #year# when the norther came in September"
      - "the #family# family say it rode in on the first norther of #year# and has come back on the first norther since"
  grasshopper_year:
    epithet: [Grasshopper, Locust]
    markers: [grasshopper]
    account:
      - "it came with the grasshoppers in #year#, the year they ate the country bare, and stayed when they had gone"
      - "it was first remarked in the grasshopper year of #year#, when the swarm darkened the sun at #place#"
  unhung_bell:
    epithet: [Bell]
    noun: [Bell]
    markers: [bell for the church, never hung]
    account:
      - "the bell was hauled overland for a church at #place# that was never built, and it was left in the grass where the wagon broke down"
      - "the bell came out from the East in #year# for a congregation that scattered before it could be hung, and it was never hung"
  trail_fence:
    epithet: [Fence, Wire]
    noun: [Fence, Wire]
    markers: [strung across, strung wire across]
    account:
      - "the fence was strung across the old trail at #place# in #year#, over the wheel ruts and, they say, over the graves beside them"
      - "#family# strung wire across the old trail in #year# to close his pasture, though the ruts still ran under it"
  windmill_well:
    epithet: [Windmill]
    noun: [Windmill, Mill]
    markers: [body was found, windmill was raised]
    account:
      - "the windmill was raised at #place# in #year# over a well where a body was found, a man no one in the district could name"
      - "#family# found a body in the old well at #place# and put up a windmill over it rather than dig another"
  blizzard_school:
    epithet: [Schoolhouse]
    noun: [Schoolhouse, School]
    markers: [teacher kept the children, held the children]
    account:
      - "in the blizzard of #year# the teacher at #place# kept the children in the schoolhouse through two nights, burning the desks, and every child lived"
      - "the sod schoolhouse at #place# is where the teacher held the children through the storm of #year#, and would not let one go out"
  set_table:
    epithet: [Shanty, Supper]
    noun: [Shanty, Claim Shanty]
    markers: [table still set, abandoned]
    account:
      - "the claim shanty at #place# was found abandoned in #year# with the table still set for four and the bread gone green"
      - "the #family# family left the shanty at #place# between one meal and the next, and the table was still set when the neighbors came"
  bone_pile:
    epithet: [Bone, Bone Rick]
    noun: [Bone Rick, Bones]
    markers: [buffalo bones, bone trade]
    account:
      - "the buffalo bones were gathered off the prairie for the bone trade in #year# and stacked at #place# for a train that did not come for them"
      - "#family# gathered buffalo bones for the bone trade and ricked them at #place#, higher than a wagon, and left them there"

manifestation:
  walker:
    noun: [Walker, Figure]
    markers: [lamplight]
    seen:
      - "a figure walking at the edge of the lamplight, never nearer and never farther"
      - "someone walking just beyond the reach of the lamplight, keeping pace with whoever carries it"
    testimony:
      - "There was someone walking out past the lamplight. When I stopped, it stopped."
      - "I held the lamp up and it walked at the very edge of it, the way a dog keeps out of reach of a stick."
  rider:
    noun: [Rider, Horseman]
    markers: [horseman, keeps pace with travelers, hallooed]
    seen:
      - "a rider who keeps pace with travelers, just too far off to hail"
      - "a horseman on the skyline who matches the traveler's gait, and does not answer"
    testimony:
      - "A rider came up alongside, a quarter mile off, and kept with me. I hallooed #him# and #he# never turned #his# head."
      - "There was a horseman on the ridge going my way and going my speed. I never heard his horse."
  wet_figure:
    noun: [Visitor, Drowned Man]
    markers: [dripping, wet through]
    seen:
      - "a figure that stands in a doorway, dripping, and is gone when a light is brought"
      - "someone standing wet through in an open doorway, with water running off them onto the boards"
    testimony:
      - "I looked up and there was someone in the doorway, wet through, the water running off onto the floor. I went for the lamp and when I came back there was only the water."
      - "It stood in the door with its clothes all running wet, and it did not come in."
  voice:
    noun: [Caller, Voice]
    markers: [calling a name, called my name]
    seen:
      - "a voice calling a name across open country, always from the same direction"
      - "a voice that calls a single name, over and over, from somewhere out in the dark"
    testimony:
      - "Somebody out there called my name, plain as day, three times. There was nobody for a mile."
      - "It was calling a name. Not mine. I have never been able to forget the name."
  knocking:
    noun: [Knocker]
    markers: [knock]
    seen:
      - "knocking at a door or window from outside, three times, with no one there"
      - "a knocking at the door, patient and regular, that stops the moment the latch is touched"
    testimony:
      - "Something knocked at the window three times. I could see the whole yard and there was nothing in it."
      - "It knocked at the door the way a neighbor knocks. I did not open it."
  phantom_team:
    noun: [Team, Wagon]
    markers: [trace chains, team and wagon, loaded wagon, wagon pull]
    seen:
      - "the sound of a team and wagon passing close by, though nothing is ever seen"
      - "the creak and jingle of a loaded wagon going past in the dark, with no wagon on the road"
    testimony:
      - "A team and wagon went right past me on the road. I heard the wheels and the trace chains. I saw nothing at all."
      - "We heard a wagon pull into the yard and stop. My father went out with the lantern and there were no tracks at all."
  lantern:
    noun: [Lantern, Light]
    markers: [swinging, swings as if carried]
    seen:
      - "a lantern swinging at the height of a walking man, with no one carrying it"
      - "a light that swings as if carried, at the height of a man's hand, crossing open ground"
    testimony:
      - "I saw a lantern coming across the field, swinging like somebody was carrying it. There was nobody carrying it."
      - "It was a lantern, plain as anything, at the height of a man's hand, and it swung the way a lantern swings in a walking hand."
  ball_light:
    noun: [Light, Fire Ball]
    markers: [rolls along, ball of light, rolling]
    seen:
      - "a ball of light that rolls along the ground and climbs the fences without slowing"
      - "a round light, about the size of a bushel basket, that rolls along the ground and passes through wire"
    testimony:
      - "A ball of light came rolling down the section line and went right through the fence without slowing."
      - "It was round and it rolled, the way a wheel rolls, along the top of the grass."
  meadow_lights:
    noun: [Lights, Meadow Lights]
    markers: [pale lights]
    seen:
      - "pale lights moving over the meadow in a loose company, never more than seven"
      - "a scatter of pale lights over the low ground that go out when looked at directly"
    testimony:
      - "There were pale lights over the meadow, five or six, drifting like people looking for something they dropped."
      - "I counted the lights and lost count, and counted again, and there was one fewer."
  fire_line:
    noun: [Fire, Fire Line]
    markers: [line of fire, without smoke, no smoke]
    seen:
      - "a line of fire along the horizon that gives no smoke and does not spread"
      - "a low red line of fire on the skyline, burning without smoke, that is never there by daylight"
    testimony:
      - "I saw a line of fire on the horizon and ran to wake the house. There was no smoke to it and it did not move."
      - "The whole west was afire in a thin red line, and not a breath of smoke anywhere."
  whirlwind:
    noun: [Whirlwind, Dust Devil]
    markers: [whirlwind, upwind]
    seen:
      - "a whirlwind that travels against the wind and does not break up on open ground"
      - "a column of dust that walks upwind, turning the wrong way"
    testimony:
      - "A whirlwind came across the pasture against the wind. It stopped at the fence and stood there, turning."
      - "It walked up into the wind like a man leaning on it, and the dust turned the wrong way round."
  ground_blizzard:
    noun: [Ground Blizzard, Drift]
    markers: [ground blizzard, waist deep]
    seen:
      - "a ground blizzard that rises on a still, clear night, with the stars plain overhead"
      - "snow blowing waist deep across the ground under a clear sky and no wind"
    testimony:
      - "The stars were all out and there was not a breath of wind and the snow was blowing waist deep across the yard."
      - "I could see the moon. I could not see my own feet for the snow going past them."
  cold_patch:
    noun: [Cold, Cold Place]
    markers: [horse's breath, cold place, like a cellar]
    seen:
      - "a patch of air cold enough to show a horse's breath in August"
      - "a cold place on open ground, a few rods across, where breath shows in midsummer"
    testimony:
      - "It was a warm night and my horse's breath came out of him white as winter."
      - "We rode into a cold like a cellar and out of it again in twenty steps."
  noon_woman:
    noun: [Noon Woman, Heat Woman]
    markers: [shimmer]
    seen:
      - "a woman's shape standing in the shimmer of noon heat at the far end of a field"
      - "the shape of a woman in the heat shimmer at midday, who is nearer each time one looks up"
    testimony:
      - "There was a woman standing in the heat at the end of the row. Every time I looked up she was nearer."
      - "She was made of the shimmer off the ground, and she had her hand up as if to call me in from the field."
  bell_ringing:
    noun: [Bell]
    markers: [no bell, bell ringing, rang and rang]
    seen:
      - "a bell ringing where no bell hangs, heard for miles on still evenings"
      - "the sound of a bell, slow and heavy, from open prairie where no bell has ever hung"
    testimony:
      - "We heard a bell ringing, slow, like a funeral, and there is no church within twenty miles."
      - "It rang and rang. I could feel it in the floor."
  returns:
    noun: [Stone, Relic]
    markers: [however far, it was back, home before]
    seen:
      - "a thing that returns to where it stood, however far it is taken"
      - "an object that, taken away, is found again in its old place within the week"
    testimony:
      - "We hauled it off to the river and left it. Three days after, it was back."
      - "My brother took it clear to town on the wagon. It was home before he was."
  wrong_water:
    noun: [Well, Water]
    markers: [came up warm, rust red, tasting of iron]
    seen:
      - "well water that comes up warm, or red, or tasting of iron"
      - "water that comes up from the well wrong: warm as blood, or rust red"
    testimony:
      - "The water came up warm as dishwater, and it tasted like a nail."
      - "We drew a bucket and it was red, and we drew another and it was clear, and nobody would drink either one."
  set_supper:
    noun: [Supper, Table]
    markers: [laid for supper, supper set out, supper on the table]
    seen:
      - "a table found laid for supper in an empty house, with the plates still warm"
      - "a supper set out for a family that is not there, the chairs pulled back as if they had just risen"
    testimony:
      - "There was supper on the table, four places, and the coffee was hot, and nobody had lived there in years."
      - "Every chair was pushed back like they had just gotten up. The lamp was lit."
  singing_wire:
    noun: [Wire, Singing Wire]
    markers: [wire was singing, sings in still air, hums and sings, one long note]
    seen:
      - "wire that sings in still air, a long high note along the whole fence line"
      - "a fence that hums and sings when there is no wind to make it"
    testimony:
      - "The wire was singing. There was no wind. I put my hand on the post and it shook."
      - "You could hear it a quarter mile off, one long note, like a finger on a glass."

disposition:
  guiding:
    temper:
      - "It means no harm, and more than one family owes a life to it, for it leads the lost toward shelter."
      - "It is counted a friend. It leads the lost toward shelter and asks nothing for it."
  warning:
    temper:
      - "It does no harm of itself, but it is not welcome, for it comes before a death or a storm."
      - "It is taken as a warning. A death or a storm has followed close on most of its visits."
  mournful:
    temper:
      - "It takes no notice of the living and seems only to grieve."
      - "It neither helps nor harms. Those who have seen it close say it seems to be grieving."
  misleading:
    temper:
      - "It leads travelers astray, and the district has buried more than one who followed it."
      - "It is a deceiver. It draws travelers off the road and leaves them where they cannot find their way."
  vengeful:
    temper:
      - "It means harm, and the old settlers hold that it means harm to one family above all."
      - "It is hostile. Stock have died where it was seen, and the #family# family have had more than their share of misfortune."
  territorial:
    temper:
      - "It keeps its ground and drives off those who linger there."
      - "It suffers no one to stay long at #place_short#, and those who try leave sooner than they meant to."

