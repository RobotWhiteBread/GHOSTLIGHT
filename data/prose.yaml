# ---------------------------------------------------------------------------
# Templates. These carry structure and voice only; no folklore of their own.
# The voice is a dry survey that lets the testimony carry the dread.

templates:
  common_name:
    revenant: ["The #epithet# #noun#", "The #noun# at #place_short#", "#family#'s #noun#", "The #place_short# #noun#"]
    light: ["The #epithet# #noun#", "The #noun# at #place_short#", "#family#'s #noun#", "The #place_short# #noun#"]
    spirit: ["The #epithet# #noun#", "The #noun# of #place_short#", "The #place_short# #noun#"]
    haunt: ["The #ohnoun# at #place_short#", "#family#'s #ohnoun#", "The #epithet# #ohnoun#", "The #place_short# #ohnoun#"]

  local_name:
    - "Among #people# it is *#term#*."
    - "#people.capitalize# call it *#term#*."
    - "The local name, among #people#, is *#term#*."
    - "It is known to #people# as *#term#*, and by that name it is recorded here."

  description:
    - "#kind_noun.a.capitalize# of #region#, manifesting as #seen#. It is met with #when#. #signs_now.capitalize#. #temper#"
    - "It appears #when#, as #seen#. #signs_now.capitalize#. #temper#"
    - "#temper# It is #kind_noun.a# of #region#, and shows itself as #seen#, most often #when#. Its presence is known because #signs_now#."
    - "Observers in #region# agree on its form: #seen#. They agree also on the occasion, which is #when#, and on the signs, which are that #signs_now#. #temper#"

  first_account:
    - "The earliest account dates from #year#, when #origin_account#. The first to report it was #witness#, who said: \"#testimony#\""
    - "#witness.capitalize# gave the first account in #year#. \"#testimony#\" By the common understanding of the district, #origin_account#."
    - "It is traced to #year#. #origin_account.capitalize#. Within the year #witness# reported the following: \"#testimony#\""
    - "\"#testimony#\" So #witness# reported it in #year#. The explanation given locally is that #origin_account#."

  precaution:
    - "#precaution#"
    - "Recommended precaution: #precaution#"
    - "#precaution# This is the counsel of #people#, and it has not been known to fail."
    - "#precaution# Those who have neglected it have generally had cause to regret it."
