  breath_shows:   {now: breath shows in a warm room, then: breath showed in a warm room}
  scorched_grass: {now: there is a smell of scorched grass, then: there was a smell of scorched grass}
  fine_ash:       {now: fine ash settles on the sill, then: there was fine ash on the sill in the morning}
  lamp_leans:     {now: the lamp flame leans toward the door, then: the lamp flame leaned toward the door}
