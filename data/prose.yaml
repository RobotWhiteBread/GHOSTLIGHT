  anniversary:      {when: [on the anniversary of the death, on the night of the year it died], past: [on the anniversary of the death, on the night of the year it died]}
  drought_noon:     {when: [at noon in a drought summer, at the height of the day in a dry year], past: [at noon in the dry summer, at the height of a dry day]}
  smoke_haze:       {when: [when smoke from a distant fire hangs in the valley, when there is smoke on the wind from some fire out of sight], past: [when smoke from a fire somewhere hung in the valley, with smoke on the wind from a fire out of sight]}
